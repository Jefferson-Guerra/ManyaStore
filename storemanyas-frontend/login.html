<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ManyaStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="login.css"> </head>
<body style="background-color: rgb(101, 171, 97);">

    <nav class="navbar navbar-dark custom-navbar justify-content-center">
        <a class="navbar-brand logo-text" href="index.html">MANYAS<span style="color: #00ff88;">STORE</span></a>
    </nav>

<div class="container mt-5">
        <div class="row">
            
            <div class="col-md-5 mx-auto">
                <div class="login-container mt-0">
                    <h2 class="text-center mb-4">Ya tengo cuenta</h2>
                    <form id="formLogin">
                        <div class="mb-3">
                            <label class="form-label">Correo Electrónico</label>
                            <input type="email" id="loginCorreo" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contraseña</label>
                            <input type="password" id="loginPassword" class="form-control" required>
                            <button class="btn btn-ojo" type="button" id="btnOjoLogin">
                                <i class="bi bi-eye" id="iconoOjoLogin"></i>
                            </button>
                        </div>
                        <button type="submit" class="btn btn-manya">Entrar</button>
                    </form>
                </div>
            </div>

            <div class="col-md-5 mx-auto">
                <div class="login-container mt-0">
                    <h2 class="text-center mb-4">Crear Cuenta</h2>
                    <form id="formRegistro">
                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" id="nombre" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Apellido</label>
                            <input type="text" id="apellido" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Correo Electrónico</label>
                            <input type="email" id="correo" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contraseña</label>
                            <div class="input-group">
                                <input type="password" id="password" class="form-control" required>
                                <button class="btn btn-ojo" type="button" id="btnOjo">
                                    <i class="bi bi-eye" id="iconoOjo"></i>
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-manya">Registrarme</button>
                    </form>
                </div>
            </div>

        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
